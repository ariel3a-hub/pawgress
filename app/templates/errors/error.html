{% extends "base.html" %}
{% block title %}{{ code }} · Pawgress{% endblock %}

{% block content %}
<div class="auth-card">
  <h1>{{ code }}</h1>
  <p class="muted">{{ detail }}</p>
  <p class="center">
    {% if current_user %}
    <a class="btn primary" href="/groups">Go to my groups</a>
    {% else %}
    <a class="btn primary" href="/login">Log in</a>
    {% endif %}
  </p>
</div>
{% endblock %}
